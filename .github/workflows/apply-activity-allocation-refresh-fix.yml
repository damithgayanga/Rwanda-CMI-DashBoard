name: Fix Activity Allocation Draft Refresh
on:
  push:
    paths:
      - '.github/workflows/apply-activity-allocation-refresh-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent live refresh from discarding unsaved activity edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='let liveCmiChannel=null, liveCmiRefreshTimer=null, liveCmiSaving=false, liveCmiRefreshing=false;'
          new=old+'\n  let allocationDraftDirty=false; // Protect unsaved allocation inputs from realtime reload.'
          assert s.count(old)==1, 'Live refresh state anchor not unique'
          s=s.replace(old,new,1)
          old='if(liveCmiSaving||sharedStateSyncTimer||liveCmiRefreshing)return;'
          new='if(allocationDraftDirty||liveCmiSaving||sharedStateSyncTimer||liveCmiRefreshing)return;'
          assert s.count(old)==1, 'Live refresh guard anchor not unique'
          s=s.replace(old,new,1)
          old='function autoSyncCmiActivityPlan(id){'
          new=old+'\n  allocationDraftDirty=true;'
          assert s.count(old)==1, 'Draft change handler anchor not unique'
          s=s.replace(old,new,1)
          old='alert(`${r.cmiNo} activity plan saved to Supabase. The Dashboard and Delivery Plan are now updated immediately.`);'
          new='allocationDraftDirty=false;\n   '+old+'\n   liveCmiRefresh(); // Resume background updates after successful save.'
          assert s.count(old)==1, 'Successful save anchor not unique'
          s=s.replace(old,new,1)
          # Mark the draft dirty as soon as a user interacts with a field; do not
          # wait for a change/blur event, which could occur after a refresh.
          old="const allocationBodyEl=document.getElementById('allocationBody');if(allocationBodyEl)allocationBodyEl.addEventListener('change'"
          new="const allocationBodyEl=document.getElementById('allocationBody');if(allocationBodyEl){allocationBodyEl.addEventListener('input',e=>{if(e.target.matches('[data-cmia-field]'))allocationDraftDirty=true});allocationBodyEl.addEventListener('change'"
          assert s.count(old)==1, 'Allocation change event anchor not unique'
          s=s.replace(old,new,1)
          old="if(panel)autoSyncCmiActivityPlan(panel.dataset.cmiPlan)});"
          new="if(panel)autoSyncCmiActivityPlan(panel.dataset.cmiPlan)});}"
          assert s.count(old)==1, 'Allocation listener close anchor not unique'
          s=s.replace(old,new,1)
          # Native browser warning guards unsaved work on a manual reload or navigation.
          anchor="  function startLiveCmiSync(){"
          assert s.count(anchor)==1, 'Live sync function anchor not unique'
          s=s.replace(anchor,"  window.addEventListener('beforeunload',e=>{if(allocationDraftDirty){e.preventDefault();e.returnValue='';}});\\n"+anchor,1)
          p.write_text(s,encoding='utf-8')
          assert 'if(allocationDraftDirty||liveCmiSaving' in s
          assert 'allocationDraftDirty=true;' in s
          assert 'allocationDraftDirty=false;' in s
          print('PASS: unsaved activity allocation changes block live 15s refresh; successful save resumes sync')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "Protect unsaved CMI Activity Allocation from background refresh"
          git push
