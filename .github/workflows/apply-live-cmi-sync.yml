name: Apply live CMI dashboard synchronization
on:
  push:
    paths:
      - scripts/apply_live_cmi_sync.py
      - .github/workflows/apply-live-cmi-sync.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply and verify patch
        run: |
          python3 scripts/apply_live_cmi_sync.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for name in ['startCmiSharedDashboardSync','broadcastCmiDashboardChange','reloadCmiSharedDashboard']:
              assert name in s
          print('Live synchronization functions confirmed')
          PY
      - name: Commit deployed application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Implement automatic live CMI Executive Dashboard updates"
          git push
