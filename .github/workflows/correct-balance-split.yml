name: Correct balance original category split
on:
  push:
    paths: ['.github/workflows/correct-balance-split.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct original category and subtraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="to be submitted - included in other cmis"
          new="included in other cmis - to be submitted"
          assert old in s, 'Original category match missing'
          s=s.replace(old,new,1)
          a="summary.otherBalance=balanceOriginalSplit.otherBalance;"
          b="summary.otherBalance=Math.max(0,updatedTeamStages.balance-summary.zeroBalance);"
          assert a in s
          s=s.replace(a,b,1)
          assert new in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct included-in-other CMIs balance category and remainder"
          git push

# Retry corrected balance split update.
