name: Expand executive breakdowns by default
on:
  push:
    paths: ['.github/workflows/default-expanded-breakdowns.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set initial expansion state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changes=[
          ("const teamExpanded=body.dataset.teamExpanded==='true';","const teamExpanded=body.dataset.teamExpanded!=='false';"),
          ("const balanceExpanded=body.dataset.balanceExpanded==='true';","const balanceExpanded=body.dataset.balanceExpanded!=='false';"),
          ("body.dataset.teamExpanded==='true':body.dataset.balanceExpanded==='true'","body.dataset.teamExpanded!=='false':body.dataset.balanceExpanded!=='false'")
          ]
          for old,new in changes:
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Expand CMI Team and Balance sections by default" && git push)
