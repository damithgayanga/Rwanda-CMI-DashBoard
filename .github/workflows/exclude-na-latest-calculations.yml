name: Exclude genuine duplicate CMI register rows from dashboard calculations
on:
  push:
    paths: ['.github/workflows/exclude-na-latest-calculations.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude duplicated records before counting or value calculations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function validCmiCalculationRecords(records){')
          end=s.index('\nfunction renderClientDashboard(){',start)
          fix="""function validCmiCalculationRecords(records){
 return (records||[]).filter(r=>{
  // Updated Register Category is authoritative for genuine duplicates.
  if(String(registerCategoryValue(r)||'').trim().toLowerCase()==='duplicated - n/a')return false;
  // Preserve the separately agreed Latest Responsibility N/A exclusion.
  const latest=String(latestResponsibilityValue(r)||'').trim().toLowerCase();
  return latest!=='n/a' && latest!=='duplicated - n/a';
 });
}
"""
          s=s[:start]+fix+s[end:]
          # A single valid CMI number may have multiple legitimate scope rows.
          # The three category sets are already deduplicated by normalized number
          # with team > submitted > agreed priority; keep those rules intact.
          assert 'summary.total=overviewCategorisedTotal;' in s
          assert s.count("if(String(registerCategoryValue(r)||'').trim().toLowerCase()==='duplicated - n/a')return false;")==1
          p.write_text(s,encoding='utf-8')
          print('Exclusion now uses the actual Updated Register Category and Latest Responsibility.')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Exclude Duplicated - N/A rows from all Overview calculations"
          git push
