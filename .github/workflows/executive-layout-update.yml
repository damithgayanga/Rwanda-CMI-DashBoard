name: Executive layout update
on:
  push:
    paths: ['.github/workflows/executive-layout-update.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dashboard CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          css = """
          @media(min-width:1101px){
          #tab-clientdashboard #clientProcessStages{grid-template-columns:repeat(6,minmax(0,1fr))}
          #tab-clientdashboard #clientProcessStages tr{padding:6px 13px}
          #tab-clientdashboard .exec-commercial-grid #clientApprovedPie .pie-layout,
          #tab-clientdashboard .exec-commercial-grid #clientSubmittedPie .pie-layout{grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:center}
          #tab-clientdashboard #clientApprovedPie .donut,
          #tab-clientdashboard #clientSubmittedPie .donut{width:240px;height:240px}
          #tab-clientdashboard #clientApprovedPie .donut-center b,
          #tab-clientdashboard #clientSubmittedPie .donut-center b{font-size:36px}
          }
          @media(min-width:761px) and (max-width:1100px){
          #tab-clientdashboard #clientProcessStages{grid-template-columns:repeat(3,minmax(0,1fr))}
          }
          """
          if 'grid-template-columns:250px minmax(0,1fr);gap:18px' not in s:
              s = s.replace('</style>',css+'</style>',1)
              p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Enlarge executive charts and align six stages" && git push)
