name: Executive section cards and collapse
on:
  push:
    paths: ['.github/workflows/executive-section-cards.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dashboard UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""'<tr><td><span class="client-stage-number">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(label)+'</span></td><td>'"""
          new="""'<tr><td><span>'+esc(label)+'</span></td><td>'"""
          assert s.count(old)==1,(s.count(old),'stage number template')
          s=s.replace(old,new)
          css="""
          /* Section 04: individual KPI cards instead of vertical dividers. */
          #tab-clientdashboard .exec-process-panel > .client-process-card{
            padding:16px!important;
            background:transparent;
            border:0;
            box-shadow:none;
          }
          #tab-clientdashboard #clientProcessStages{
            display:grid!important;
            grid-template-columns:repeat(6,minmax(0,1fr))!important;
            gap:12px!important;
          }
          #tab-clientdashboard #clientProcessStages tr{
            display:flex;flex-direction:column;justify-content:space-between;
            padding:18px 12px!important;min-width:0;min-height:132px;
            border:1px solid #dde6ee!important;border-radius:12px;
            background:#fff;box-shadow:0 3px 12px rgba(22,50,73,.055);
            gap:12px;
          }
          #tab-clientdashboard #clientProcessStages tr:first-child{padding-left:12px!important}
          #tab-clientdashboard #clientProcessStages tr:last-child{padding-right:12px!important}
          #tab-clientdashboard #clientProcessStages td:first-child{
            justify-content:center;align-items:flex-start;min-height:48px;
            text-align:center;width:100%;line-height:1.3;
          }
          #tab-clientdashboard #clientProcessStages td:first-child span{
            display:block;width:100%;white-space:normal;
            overflow-wrap:break-word;
          }
          #tab-clientdashboard #clientProcessStages td:last-child{
            width:100%!important;display:flex!important;
            justify-content:center!important;align-items:center!important;
            text-align:center!important;font-size:36px;
          }
          #tab-clientdashboard .exec-process-panel .client-process-table{min-width:0!important}
          @media(max-width:1000px){
            #tab-clientdashboard #clientProcessStages{grid-template-columns:repeat(3,minmax(0,1fr))!important}
          }
          @media(max-width:600px){
            #tab-clientdashboard #clientProcessStages{grid-template-columns:repeat(2,minmax(0,1fr))!important}
          }
          /* Executive panels collapse independently while headings stay visible. */
          #tab-clientdashboard article.exec-panel.exec-section-collapsed > .card{display:none!important}
          #tab-clientdashboard .exec-section-toggle{
            margin-left:auto;flex:0 0 auto;display:inline-flex;
            justify-content:center;align-items:center;width:32px;height:32px;
            border:1px solid #dae5ee;background:#fff;border-radius:8px;
            color:#315fa8;font-size:20px;cursor:pointer;
          }
          #tab-clientdashboard .exec-section-toggle:hover{background:#edf4fa}
          #tab-clientdashboard .exec-section-toggle:focus-visible{outline:2px solid #315fa8;outline-offset:2px}
          """
          js="""
          <script>
          (function(){
            function initExecutivePanelToggles(){
              document.querySelectorAll('#tab-clientdashboard article.exec-panel').forEach(function(panel,index){
                const heading=panel.querySelector(':scope > header.exec-panel-heading');
                if(!heading||heading.querySelector('.exec-section-toggle'))return;
                const title=heading.querySelector('h2');
                const btn=document.createElement('button');
                btn.type='button';
                btn.className='exec-section-toggle';
                btn.textContent='⌃';
                btn.setAttribute('aria-expanded','true');
                const label=title?title.textContent:'section';
                btn.setAttribute('aria-label','Collapse '+label);
                btn.addEventListener('click',function(){
                  const collapsed=panel.classList.toggle('exec-section-collapsed');
                  btn.setAttribute('aria-expanded',String(!collapsed));
                  btn.setAttribute('aria-label',(collapsed?'Expand ':'Collapse ')+label);
                  btn.textContent=collapsed?'⌄':'⌃';
                });
                heading.appendChild(btn);
              });
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initExecutivePanelToggles);
            else initExecutivePanelToggles();
          })();
          </script>
          """
          if 'Section 04: individual KPI cards' not in s:
              at=s.rfind('</style>')
              assert at>=0
              s=s[:at]+css+s[at:]
              at=s.rfind('</body>')
              assert at>=0
              s=s[:at]+js+s[at:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Restyle six stages as cards and add independent section collapse" && git push)
