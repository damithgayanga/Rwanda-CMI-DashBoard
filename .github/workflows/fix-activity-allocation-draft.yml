name: Inspect Activity Allocation Form
on:
  push:
    paths:
      - '.github/workflows/fix-activity-allocation-draft.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect activity and refresh handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          terms=['Activity Allocation','Save CMI Activity Plan','Measurement Works & Valuation','setInterval(','location.reload(','visibilitychange','scheduleActivity','activityPlan']
          report=[]
          for term in terms:
            hit=[i for i,line in enumerate(lines) if term.lower() in line.lower()]
            print('\n###',repr(term),'matches',len(hit))
            for i in hit[:5]:
              print('\n-- L',i+1,'--')
              for j in range(max(0,i-7),min(len(lines),i+10)):
                report.append(f'{j+1}: {lines[j][:400]}')
          for start,end in [(3730,3848)]:
            report.append('\\n### FULL SOURCE '+str(start)+'-'+str(end))
            report.extend(f'{i+1}: {lines[i][:1300]}' for i in range(start-1,min(len(lines),end)))
          for term in ['autoSyncCmiActivityPlan(', 'renderAllocation();', 'loadSharedDashboardState(', 'refreshShared', 'syncFromSupabase', 'data-cmia-field', 'setInterval(']:
            hits=[i for i,line in enumerate(lines) if term in line]
            report.append('\\n### USE '+term+' '+str(len(hits)))
            for i in hits[:18]:
              report.extend(f'{j+1}: {lines[j][:500]}' for j in range(max(0,i-2),min(len(lines),i+3)))
          Path('.github/activity-allocation-inspection.txt').write_text('\\n'.join(report),encoding='utf-8')
          PY
      - name: Save inspection in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/activity-allocation-inspection.txt
          git commit -m 'Record Activity Allocation code inspection' || true
          git push
