name: Fix duplicate CMI register right-side masking
on:
  push:
    paths:
      - '.github/workflows/fix-duplicate-right-columns.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct duplicate mask at latest responsibility boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # The latest responsibility dropdown may itself be marked as duplicated.
          opt="const LATEST_RESPONSIBILITY_OPTIONS=['CMI Team','Others','ReOpen - CMI Team'];"
          if opt in s:
              s=s.replace(opt,"const LATEST_RESPONSIBILITY_OPTIONS=['CMI Team','Others','ReOpen - CMI Team','Duplicated - N/A'];",1)
          # Replace prior mask with a robust, idempotent implementation.
          a=s.index('function applyDuplicateRegisterMask(){')
          b=s.index('\nfunction renderRegister(){',a)
          s=s[:a]+"""function applyDuplicateRegisterMask(){
           const body=document.getElementById('registerBody');
           const table=document.querySelector('#tab-register .data-table');
           if(!body||!table)return;
           const headers=Array.from(table.querySelectorAll('thead th')).map(h=>h.textContent.replace(/\\s+/g,' ').trim());
           const latest=headers.findIndex(h=>h.includes('CMI Delivery Responsibility - Latest'));
           const updated=headers.findIndex(h=>h.includes('Updated Register Category'));
           if(latest<0||updated<0)return;
           Array.from(body.rows).forEach((tr,i)=>{
            const record=filteredRegister[i];
            if(!record)return;
            const isDuplicate=registerCategoryValue(record)==='Duplicated - N/A'||latestResponsibilityValue(record)==='Duplicated - N/A';
            if(!isDuplicate)return;
            // Mask all fields after Updated Register Category for duplicates,
            // including the latest responsibility where it follows that column.
            const first=registerCategoryValue(record)==='Duplicated - N/A'?updated+1:latest+1;
            for(let col=first;col<tr.cells.length;col++)tr.cells[col].textContent='N/A';
           });
          }
          """+s[b:]
          assert 'applyDuplicateRegisterMask();' in s[s.index('function renderRegister(){'):s.index('\nfunction allocationFilters(){')]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit corrected mask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct duplicate CMI masking after latest responsibility"
          git push
