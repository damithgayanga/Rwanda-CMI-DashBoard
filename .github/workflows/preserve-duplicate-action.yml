name: Preserve Action column on duplicated CMIs
on:
  push:
    paths:
      - '.github/workflows/preserve-duplicate-action.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude Action from duplicate masking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function applyDuplicateRegisterMask(){')
          end=s.index('\nfunction renderRegister(){',start)
          block=s[start:end]
          old="for(let col=first;col<tr.cells.length;col++)tr.cells[col].textContent='N/A';"
          new="for(let col=first;col<tr.cells.length;col++){if(headers[col]==='Action')continue;tr.cells[col].textContent='N/A';}"
          assert block.count(old)==1, 'Expected duplicate mask not found'
          block=block.replace(old,new,1)
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve Action buttons on duplicated CMI register rows"
          git push
