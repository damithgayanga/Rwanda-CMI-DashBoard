name: Executive team main row styling
on:
  push:
    paths: ['.github/workflows/team-main-row-style.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update team main row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="(x[3]&&i!==3?'<span class=\"client-overview-swatch\" style=\"background:'+x[3]+'\"></span>':'')"
          new="(x[3]?'<span class=\"client-overview-swatch\" style=\"background:'+x[3]+'\"></span>':'')"
          assert s.count(old)==1,(old,s.count(old))
          s=s.replace(old,new)
          css="""
          /* Main team breakdown row uses the same regular text weight as other classifications. */
          #tab-clientdashboard #clientOverviewRows .client-overview-team-total,
          #tab-clientdashboard #clientOverviewRows .client-overview-team-total td{
            font-weight:400!important;
          }
          """
          if 'Main team breakdown row uses the same regular text weight' not in s:
              pos=s.rfind('</style>')
              assert pos>=0
              s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Use regular font and swatch for main CMI Team breakdown" && git push)
