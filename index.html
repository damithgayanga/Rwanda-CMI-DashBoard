<title>CMI Assessment & Delivery Control Dashboard</title>
<style>

.header-main{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand-left{display:flex;align-items:center;gap:18px;min-width:0}.logo-strip{display:flex;align-items:center;gap:10px}.logo-card{height:60px;width:125px;background:#fff;border-radius:8px;padding:5px 8px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.16)}.logo-card img{max-width:100%;max-height:100%;object-fit:contain}.logo-card.dmd{width:132px}.divider{height:48px;width:1px;background:rgba(255,255,255,.25)}
.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;opacity:.72;font-weight:800}.topbar h1{font-size:22px;margin:3px 0 3px;line-height:1.16}.subline{font-size:11px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:820px}.updated{font-size:11px;text-align:right;opacity:.83;white-space:nowrap}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.tabbtn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:white;border-radius:8px;padding:8px 11px;font-size:11px;font-weight:800}.tabbtn.active{background:#fff;color:var(--navy);border-color:#fff}

.kpi-stage .value{font-size:24px;margin-top:4px}.kpi-stage .kpi-group{margin-top:4px}.kpi-stage .kpi-sub{padding:3px 0}.kpi-stage .kpi-sub-value{font-size:15px}

.filters{display:grid;grid-template-columns:2.1fr repeat(5,minmax(130px,1fr));gap:9px;margin-bottom:12px}.filters input,.filters select,.form-grid input,.form-grid select,.form-grid textarea,.plan-controls input,.plan-controls select,.bulkbar input,.bulkbar select,.inline-input,.inline-select{width:100%;border:1px solid #c8d4df;border-radius:7px;background:white;padding:8px 9px;color:var(--ink);font-size:11px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #b8c6d4;background:#fff;border-radius:8px;padding:8px 11px;font-size:11px;font-weight:800;color:var(--navy)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.good{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:var(--red);border-color:#efb4ae}.btn:disabled{opacity:.5;cursor:not-allowed}

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://bihinnobxcpotuctursj.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Vf4h_Nmo4Er-oTuCXEXOfg_z5QRCG71';
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let currentDashboardUser=null;

  const ROLE_TABS={
    admin:['dashboard','register','process','organisation','delivery','progress','activities','allocation','quality','audit'],
    management:['dashboard','register','process','organisation','delivery','progress'],
    progress:['delivery','progress']
  };

  function currentRole(){return currentDashboardUser?.access_role||''}
  function canManageDelivery(){return currentRole()==='admin'||currentRole()==='management'}
  function canAdmin(){return currentRole()==='admin'}

  async function fetchDashboardProfile(){
    const {data:{user}}=await supabaseClient.auth.getUser();
    if(!user)return null;
    const {data,error}=await supabaseClient.from('dashboard_users').select('id,username,display_name,access_role,active').eq('id',user.id).single();
    if(error||!data||!data.active)return null;
    return data;
  }

  function applyRoleAccess(){
    const role=currentRole(),allowed=new Set(ROLE_TABS[role]||[]);
    document.body.classList.toggle('progress-role',role==='progress');
    document.querySelectorAll('.tabbtn').forEach(btn=>{
      const ok=allowed.has(btn.dataset.tab);
      btn.style.display=ok?'':'none';
      if(!ok)btn.classList.remove('active');
    });
    document.querySelectorAll('.tab').forEach(tab=>{
      const key=tab.id.replace('tab-','');
      if(!allowed.has(key))tab.classList.remove('active');
    });
    const name=currentDashboardUser?.display_name||currentDashboardUser?.username||'';
    const nameEl=document.getElementById('currentUserName'),roleEl=document.getElementById('currentUserRole');
    if(nameEl)nameEl.textContent=name;if(roleEl)roleEl.textContent=role;
    const active=document.querySelector('.tabbtn.active');
    if(!active||!allowed.has(active.dataset.tab)){
      const first=role==='progress'?'delivery':(ROLE_TABS[role]||[])[0];
      const btn=document.querySelector(`.tabbtn[data-tab="${first}"]`);
      const tab=document.getElementById('tab-'+first);
      if(btn)btn.classList.add('active');if(tab)tab.classList.add('active');
    }
  }

  async function signInDashboard(){
    const u=(document.getElementById('loginUsername')?.value||'').trim();
    const p=document.getElementById('loginPassword')?.value||'';
    const err=document.getElementById('loginError');if(err)err.textContent='';
    if(!u||!p){if(err)err.textContent='Enter both username and password.';return}
    const btn=document.getElementById('loginBtn');if(btn)btn.disabled=true;
    try{
      const {data:emailData,error:emailError}=await supabaseClient.rpc('dashboard_login_email',{p_username:u});
      if(emailError||!emailData)throw new Error('Invalid username or password.');
      const {error:loginError}=await supabaseClient.auth.signInWithPassword({email:emailData,password:p});
      if(loginError)throw new Error('Invalid username or password.');
      currentDashboardUser=await fetchDashboardProfile();
      if(!currentDashboardUser)throw new Error('This dashboard account is inactive or not configured.');
      await startAuthenticatedDashboard();
    }catch(e){
      await supabaseClient.auth.signOut();
      if(err)err.textContent=e.message||'Unable to sign in.';
    }finally{if(btn)btn.disabled=false}
  }

  async function signOutDashboard(){
    await supabaseClient.auth.signOut();
    location.reload();
  }

  async function loadAuditLog(){
    if(!canAdmin())return;
    const body=document.getElementById('auditBody');if(!body)return;
    body.innerHTML='<tr><td colspan="8" class="muted">Loading audit trail…</td></tr>';
    const {data,error}=await supabaseClient.from('audit_log').select('id,username,access_role,table_name,action,record_key,old_data,new_data,changed_at').order('changed_at',{ascending:false}).limit(1000);
    if(error){body.innerHTML='<tr><td colspan="8" class="muted">Unable to load audit trail.</td></tr>';console.error(error);return}
    window.dashboardAuditRows=data||[];
    renderAuditLog();
  }

  function renderAuditLog(){
    const rows=window.dashboardAuditRows||[],uf=(document.getElementById('auditUserFilter')?.value||'').toLowerCase(),af=document.getElementById('auditActionFilter')?.value||'',tf=(document.getElementById('auditTableFilter')?.value||'').toLowerCase(),rf=(document.getElementById('auditRecordFilter')?.value||'').toLowerCase();
    const filtered=rows.filter(x=>(!uf||String(x.username||'').toLowerCase().includes(uf))&&(!af||x.action===af)&&(!tf||String(x.table_name||'').toLowerCase().includes(tf))&&(!rf||String(x.record_key||'').toLowerCase().includes(rf)));
    const count=document.getElementById('auditCount');if(count)count.textContent=`Showing ${filtered.length} of ${rows.length} recorded changes`;
    const body=document.getElementById('auditBody');if(!body)return;
    const pretty=v=>v?esc(JSON.stringify(v,null,2)):'—';
    body.innerHTML=filtered.map(x=>`<tr><td class="nowrap">${new Date(x.changed_at).toLocaleString('en-NZ')}</td><td><b>${esc(x.username||'System')}</b></td><td>${esc(x.access_role||'')}</td><td>${esc(x.action)}</td><td>${esc(x.table_name)}</td><td>${esc(x.record_key||'')}</td><td class="audit-json">${pretty(x.old_data)}</td><td class="audit-json">${pretty(x.new_data)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No audit records match the current filters.</td></tr>';
  }

  async function startAuthenticatedDashboard(){
    document.getElementById('authScreen')?.classList.add('auth-hidden');
    document.getElementById('dashboardApp')?.classList.remove('auth-hidden');
    applyRoleAccess();
    await loadSharedDashboardState();
    await loadDeliveryActivitiesFromSupabase();
    renderAll();
    await loadResourcesFromSupabase();
    if(canAdmin())await loadAuditLog();
  }

  const SHARED_STATE_RESOURCE_NAME = '__CMI_DASHBOARD_SHARED_STATE__';
  let sharedStateSyncTimer = null;
  let sharedStateLoaded = false;

  function compactSharedState() {
    return {
      version: 1,
      savedAt: new Date().toISOString(),
      meta: {
        highLevelPlan: clone(state.meta.highLevelPlan||[]),
        highLevelGroupProgress: clone(state.meta.highLevelGroupProgress||{}),
        highLevelResourceProgress: clone(state.meta.highLevelResourceProgress||{}),
        deliveryLevel1: clone(state.meta.deliveryLevel1||[]),
        activityList: clone(state.meta.activityList||[]),
        resourceAssignmentResetVersion: Math.max(1, Number(state.meta.resourceAssignmentResetVersion)||0)
      },
      records: state.records.filter(r=>{
        const acts=r.cmiActivities||[];
        return r.inDeliveryPlan||acts.length||hasActivityProgress(r);
      }).map(r=>({
        id:r.id,
        cmiKey:r.cmiKey,
        inDeliveryPlan:!!r.inDeliveryPlan,
        siteResource:r.siteResource||'',
        offsiteResource:r.offsiteResource||'',
        startDate:r.startDate||'',
        targetDate:r.targetDate||'',
        finishDate:r.finishDate||'',
        deliveryStatus:r.deliveryStatus||'To be Started',
        progressPct:Number(r.progressPct)||0,
        cmiActivities:clone(r.cmiActivities||[])
      }))
    };
  }

  function sharedValue(localValue, remoteValue) {
    if(remoteValue===undefined||remoteValue===null||remoteValue==='')return localValue;
    return remoteValue;
  }

  function mergeActivityCollections(localActs, remoteActs) {
    const out=clone(Array.isArray(localActs)?localActs:[]);
    const keyOf=a=>String((a&&a.id)||(a&&a.activityId)||(a&&a.activityName)||'');
    (Array.isArray(remoteActs)?remoteActs:[]).forEach(ra=>{
      const key=keyOf(ra);
      let la=out.find(a=>keyOf(a)===key);
      if(!la){out.push(clone(ra));return}
      ['activityId','activityName','siteResource','offsiteResource','startDate','targetDate','finishDate','actualStartDate','actualFinishDate','status','notes'].forEach(k=>{
        la[k]=sharedValue(la[k],ra[k]);
      });
      la.progressPct=Math.max(Number(la.progressPct)||0,Number(ra.progressPct)||0);
      la.resourceProgress={...(la.resourceProgress||{}),...(ra.resourceProgress||{})};
    });
    return out;
  }

  function mergeSharedState(payload) {
    if(!payload||!Array.isArray(payload.records))return false;
    if(payload.meta){
      ['highLevelPlan','deliveryLevel1','activityList'].forEach(k=>{
        if(Array.isArray(payload.meta[k])&&payload.meta[k].length)state.meta[k]=clone(payload.meta[k]);
      });
      ['highLevelGroupProgress','highLevelResourceProgress'].forEach(k=>{
        if(payload.meta[k]&&typeof payload.meta[k]==='object')state.meta[k]={...(state.meta[k]||{}),...clone(payload.meta[k])};
      });
      state.meta.resourceAssignmentResetVersion=Math.max(
        1,
        Number(state.meta.resourceAssignmentResetVersion)||0,
        Number(payload.meta.resourceAssignmentResetVersion)||0
      );
    }else{
      state.meta.resourceAssignmentResetVersion=Math.max(1,Number(state.meta.resourceAssignmentResetVersion)||0);
    }
    payload.records.forEach(sr=>{
      const r=state.records.find(x=>x.id===sr.id)||state.records.find(x=>String(x.cmiKey||'')===String(sr.cmiKey||''));
      if(!r)return;
      r.inDeliveryPlan=!!(r.inDeliveryPlan||sr.inDeliveryPlan);
      ['siteResource','offsiteResource','startDate','targetDate','finishDate'].forEach(k=>{r[k]=sharedValue(r[k],sr[k])});
      if(sr.deliveryStatus&&sr.deliveryStatus!=='To be Started')r.deliveryStatus=sr.deliveryStatus;
      r.progressPct=Math.max(Number(r.progressPct)||0,Number(sr.progressPct)||0);
      r.cmiActivities=mergeActivityCollections(r.cmiActivities,sr.cmiActivities);
    });
    state.meta.resourceAssignmentResetVersion=Math.max(1,Number(state.meta.resourceAssignmentResetVersion)||0);
    state=ensureShape(state);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
    return true;
  }

  async function loadSharedDashboardState() {
    try{
      const {data,error}=await supabaseClient.from('resources').select('id,resource_name,role,active,is_deleted,updated_at').eq('resource_name',SHARED_STATE_RESOURCE_NAME).limit(1);
      if(error){console.error('Unable to load shared dashboard state:',error);return false}
      const row=(data||[])[0];
      let loaded=false;
      if(row&&row.role){
        try{
          const payload=JSON.parse(row.role);
          loaded=mergeSharedState(payload);
        }catch(e){console.error('Invalid shared dashboard state:',e)}
      }
      const meaningful=state.records.some(
